<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ש.ל גבייה</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:Arial,sans-serif}.app{max-width:1100px;margin:auto;padding:12px}.card{background:#151922;border:1px solid #292f3b;border-radius:20px;padding:16px;margin:12px 0}.hidden{display:none!important}h1,h2{margin:5px 0}.muted{color:#9ba5b5;font-size:14px}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap}.tabs{position:sticky;top:5px;background:#090b10;padding:8px;z-index:5}.tabs button{width:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}input,textarea,select,button{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid #343b49;background:#0e1219;color:white}button{border:0;background:#292f3b;font-weight:bold}.red{background:#d51b16}.green{background:#159568}.blue{background:#246ee9}.orange{background:#df8200}.view{display:none}.view.active{display:block}.stat{font-size:27px;font-weight:bold}.item{border-top:1px solid #2a303b;padding:15px 0}.item:first-child{border:0}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:#29303c;font-size:12px}.paid{color:#65e6ad}.late{color:#ff7972}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.empty{text-align:center;color:#9ba5b5;padding:25px}.auth{max-width:430px;margin:50px auto}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222936;padding:12px;border-radius:12px;display:none;z-index:20}
</style></head><body><div class="app">
<section id="auth" class="card auth"><h1>ש.ל גבייה</h1><p class="muted">מערכת גבייה וניהול ריטיינרים</p><input id="accessCode" type="password" inputmode="numeric" maxlength="6" placeholder="קוד גישה"><button id="enterApp" class="red" style="margin-top:8px">כניסה</button></section>
<section id="main" class="hidden">
<div class="card"><h1 id="title">ש.ל עבודות אחזקה — גבייה</h1><span class="muted">מערכת גבייה בענן</span><button id="logout" style="margin-top:8px">יציאה</button></div>
<div class="tabs"><button data-tab="dashboard" class="red">לוח גבייה</button><button data-tab="clients">לקוחות</button><button data-tab="payments">תשלומים</button><button data-tab="settings">הגדרות</button></div>
<section id="dashboard" class="view active">
<div class="grid"><div class="card"><span class="muted">לקוחות</span><div id="sClients" class="stat">0</div></div><div class="card"><span class="muted">פתוח</span><div id="sOpen" class="stat">₪0</div></div><div class="card"><span class="muted">שולם</span><div id="sPaid" class="stat">₪0</div></div><div class="card"><span class="muted">באיחור</span><div id="sLate" class="stat">0</div></div></div>
<div class="card"><div class="row"><select id="month"></select><button id="gen" class="red">צור חיובים חסרים</button></div></div>
<div class="card"><h2>חיובים</h2><div id="chargeList"></div></div></section>
<section id="clients" class="view"><div class="card"><h2 id="formTitle">הוספת לקוח</h2><form id="clientForm"><div class="grid"><input id="cName" placeholder="שם לקוח" required><input id="cPhone" placeholder="טלפון"><input id="cEmail" type="email" placeholder="אימייל"><input id="cAmount" type="number" placeholder="סכום חודשי ₪" required><input id="cDue" type="number" min="1" max="28" value="1" placeholder="יום חיוב"><select id="cType"><option value="regular">חיוב חודשי</option><option value="retainer">ריטיינר חודשי</option></select></div><div class="row" style="margin-top:8px"><button class="red">שמור לקוח</button><button type="button" id="cancelEdit" class="hidden">בטל</button></div></form></div><div class="card"><h2>לקוחות קיימים</h2><div id="clientList"></div></div></section>
<section id="payments" class="view"><div class="card"><h2>היסטוריית תשלומים</h2><div id="paymentList"></div></div></section>
<section id="settings" class="view"><div class="card"><h2>הגדרות עסק</h2><input id="bizName" placeholder="שם העסק"><textarea id="bank" placeholder="פרטי העברה בנקאית" style="margin-top:8px"></textarea><button id="saveSettings" class="red" style="margin-top:8px">שמור</button></div></section>
</section></div><div id="toast" class="toast"></div>
<script>
'use strict';
const API='https://gsszubmbenmhfkosqaei.supabase.co/functions/v1/collections-api',$=x=>document.getElementById(x);let accessCode=localStorage.getItem('sl_access_code')||'',clients=[],charges=[],payments=[],business=null,editId=null;
async function api(p,m='GET',b){let r=await fetch(API+'/'+p,{method:m,headers:{'Content-Type':'application/json','x-access-code':accessCode},body:b===undefined?undefined:JSON.stringify(b)}),x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'שגיאה');return x}
const money=n=>'₪'+Number(n||0).toLocaleString('he-IL'),esc=s=>String(s??'').replace(/[&<>"]/g,'');
function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function mk(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function phone(p=''){let x=p.replace(/\D/g,'');if(x.startsWith('0'))x='972'+x.slice(1);return x}
function type(c){return localStorage.getItem('type_'+c.id)||'regular'}
function message(c,ch){let t=type(c)==='retainer'?'ריטיינר החודשי':'התשלום החודשי';return `שלום ${c.name}, תזכורת מ${business?.name||'ש.ל עבודות אחזקה'} לגבי ${t} עבור ${ch.charge_month.slice(0,7)} בסך ${money(ch.amount)}.\n\nפרטי העברה בנקאית:\n${business?.bank_details||'יש לפנות אלינו לקבלת פרטי החשבון'}\n\nאם תרצה שנזכיר שוב בעוד יומיים, השב כאן: הזכר לי בעוד יומיים.\nתודה 🙏`}
function late(x){return x.status!=='paid'&&new Date(x.due_date+'T23:59:59')<new Date()}
function months(){if($('month').options.length)return;for(let i=-6;i<=12;i++){let d=new Date();d.setMonth(d.getMonth()+i);let o=document.createElement('option');o.value=mk(d);o.textContent=d.toLocaleDateString('he-IL',{month:'long',year:'numeric'});if(i===0)o.selected=true;$('month').appendChild(o)}}
async function load(){let x=await api('all');business=x.business;clients=x.clients||[];charges=x.charges||[];payments=x.payments||[];months();render()}
function render(){dash();clientRender();paymentRender();$('title').textContent=(business?.name||'ש.ל עבודות אחזקה')+' — גבייה';$('bizName').value=business?.name||'';$('bank').value=business?.bank_details||''}
function dash(){let m=$('month').value||mk(),list=charges.filter(x=>x.charge_month.slice(0,7)===m);$('sClients').textContent=clients.filter(x=>x.active).length;$('sOpen').textContent=money(list.filter(x=>x.status==='open').reduce((a,b)=>a+Number(b.amount),0));$('sPaid').textContent=money(list.filter(x=>x.status==='paid').reduce((a,b)=>a+Number(b.amount),0));$('sLate').textContent=list.filter(late).length;let r=$('chargeList');r.innerHTML='';if(!list.length)return r.innerHTML='<div class="empty">אין חיובים בחודש הזה</div>';list.forEach(ch=>{let c=clients.find(x=>x.id===ch.client_id);if(!c)return;let d=document.createElement('div');d.className='item';d.innerHTML=`<b>${esc(c.name)}</b> — ${money(ch.amount)} <span class="pill">${type(c)==='retainer'?'ריטיינר':'חודשי'}</span> <span class="pill ${ch.status==='paid'?'paid':late(ch)?'late':''}">${ch.status==='paid'?'שולם':late(ch)?'באיחור':'ממתין'}</span><div class="muted">לתשלום: ${new Date(ch.due_date+'T12:00').toLocaleDateString('he-IL')}</div><div class="actions"><button class="green" data-a="wa">WhatsApp</button><button class="blue" data-a="mail">מייל</button><button class="orange" data-a="rem">הזכר בעוד יומיים</button><button class="red" data-a="paid">${ch.status==='paid'?'פתח מחדש':'סמן כשולם'}</button></div>`;d.querySelector('[data-a=wa]').onclick=()=>{if(!c.phone)return toast('אין טלפון');location.href='https://wa.me/'+phone(c.phone)+'?text='+encodeURIComponent(message(c,ch))};d.querySelector('[data-a=mail]').onclick=()=>{if(!c.email)return toast('אין אימייל');location.href='mailto:'+c.email+'?body='+encodeURIComponent(message(c,ch))};d.querySelector('[data-a=rem]').onclick=()=>remind(ch);d.querySelector('[data-a=paid]').onclick=()=>paid(ch);r.appendChild(d)})}
function clientRender(){let r=$('clientList');r.innerHTML='';if(!clients.length)return r.innerHTML='<div class="empty">אין לקוחות</div>';clients.forEach(c=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<b>${esc(c.name)}</b> — ${money(c.monthly_amount)} <span class="pill">${type(c)==='retainer'?'ריטיינר':'חודשי'}</span><div class="muted">${esc(c.phone||'')} ${esc(c.email||'')}</div><div class="actions"><button data-a="edit">ערוך</button><button class="green" data-a="wa">WhatsApp</button><button class="blue" data-a="mail">מייל</button><button class="red" data-a="del">מחק</button></div>`;d.querySelector('[data-a=edit]').onclick=()=>edit(c);d.querySelector('[data-a=wa]').onclick=()=>location.href='https://wa.me/'+phone(c.phone);d.querySelector('[data-a=mail]').onclick=()=>location.href='mailto:'+c.email;d.querySelector('[data-a=del]').onclick=()=>del(c);r.appendChild(d)})}
function paymentRender(){let r=$('paymentList');r.innerHTML='';if(!payments.length)return r.innerHTML='<div class="empty">אין תשלומים</div>';payments.forEach(p=>{let c=clients.find(x=>x.id===p.client_id),d=document.createElement('div');d.className='item';d.innerHTML=`<b>${esc(c?.name||'לקוח')}</b> — ${money(p.amount)}<div class="muted">${new Date(p.paid_at).toLocaleString('he-IL')}</div>`;r.appendChild(d)})}
async function generate(){let m=$('month').value,a=[];for(let c of clients.filter(x=>x.active))if(!charges.some(x=>x.client_id===c.id&&x.charge_month.slice(0,7)===m))a.push({owner_id:'app',client_id:c.id,charge_month:m+'-01',amount:c.monthly_amount,due_date:m+'-'+String(c.due_day||1).padStart(2,'0'),status:'open'});if(!a.length){await load();return toast('אין חיובים חסרים')}try{let x=await api('charges','POST',a);charges.push(...(Array.isArray(x)?x:[x]));render();toast('החיובים נוצרו')}catch(e){toast(e.message)}}
async function remind(ch){let d=new Date();d.setDate(d.getDate()+2);try{let x=await api('charges?id='+ch.id,'PATCH',{remind_at:d.toISOString()});ch.remind_at=x.remind_at||d.toISOString();render();toast('תזכורת נקבעה לעוד יומיים')}catch(e){toast(e.message)}}
async function paid(ch){try{if(ch.status==='paid'){await api('payments?field=charge_id&value='+ch.id,'DELETE');await api('charges?id='+ch.id,'PATCH',{status:'open'});ch.status='open';payments=payments.filter(x=>x.charge_id!==ch.id)}else{await api('charges?id='+ch.id,'PATCH',{status:'paid'});let p=await api('payments','POST',{charge_id:ch.id,client_id:ch.client_id,amount:ch.amount,method:'manual'});ch.status='paid';payments.unshift(Array.isArray(p)?p[0]:p)}render()}catch(e){toast(e.message)}}
function edit(c){editId=c.id;$('cName').value=c.name;$('cPhone').value=c.phone||'';$('cEmail').value=c.email||'';$('cAmount').value=c.monthly_amount;$('cDue').value=c.due_day;$('cType').value=type(c);$('formTitle').textContent='עריכת לקוח';$('cancelEdit').classList.remove('hidden');document.querySelector('[data-tab=clients]').click()}
async function del(c){if(!confirm('למחוק את הלקוח?'))return;try{await api('clients?id='+c.id,'DELETE');clients=clients.filter(x=>x.id!==c.id);charges=charges.filter(x=>x.client_id!==c.id);render()}catch(e){toast(e.message)}}
$('clientForm').onsubmit=async e=>{e.preventDefault();let row={owner_id:'app',name:$('cName').value.trim(),phone:$('cPhone').value.trim(),email:$('cEmail').value.trim(),monthly_amount:Number($('cAmount').value),due_day:Number($('cDue').value),active:true},t=$('cType').value;try{if(editId){delete row.owner_id;let x=await api('clients?id='+editId,'PATCH',row);clients=clients.map(c=>c.id===editId?x:c);localStorage.setItem('type_'+editId,t)}else{let x=await api('clients','POST',row),c=Array.isArray(x)?x[0]:x;clients.push(c);localStorage.setItem('type_'+c.id,t)}editId=null;$('clientForm').reset();$('cDue').value=1;render();toast('הלקוח נשמר')}catch(e){toast(e.message)}};
$('cancelEdit').onclick=()=>{editId=null;$('clientForm').reset();$('cancelEdit').classList.add('hidden')};$('gen').onclick=generate;$('month').onchange=dash;
$('saveSettings').onclick=async()=>{try{business=await api('businesses?id='+business.id,'PATCH',{name:$('bizName').value.trim()||'ש.ל עבודות אחזקה',bank_details:$('bank').value.trim()});render();toast('נשמר')}catch(e){toast(e.message)}};
$('enterApp').onclick=async()=>{let c=$('accessCode').value.trim();if(!/^\d{6}$/.test(c))return toast('קוד בן 6 ספרות');accessCode=c;try{await api('all');localStorage.setItem('sl_access_code',c);$('auth').classList.add('hidden');$('main').classList.remove('hidden');await load()}catch{accessCode='';toast('קוד שגוי')}};
$('logout').onclick=()=>{localStorage.removeItem('sl_access_code');location.reload()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(b.dataset.tab).classList.add('active')});
if(accessCode){$('auth').classList.add('hidden');$('main').classList.remove('hidden');load().catch(()=>{$('auth').classList.remove('hidden');$('main').classList.add('hidden')})}
</script></body></html>
